# Umami (analitica MedSync) -> contenedor docker en 127.0.0.1:3100 (/opt/umami)
server {
    server_name analytics.medsync.mx analytics.hemia.cloud;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/analytics.medsync.mx/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/analytics.medsync.mx/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    if ($host = analytics.hemia.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = analytics.medsync.mx) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name analytics.medsync.mx analytics.hemia.cloud;
    return 404; # managed by Certbot




}